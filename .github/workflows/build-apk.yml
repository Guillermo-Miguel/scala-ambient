name: Compilar APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk ScalaAmbient.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScalaAmbient-apk
          path: ScalaAmbient.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Scala Ambient ${{ github.run_number }}
          body: "APK lista para instalar en el móvil."
          files: ScalaAmbient.apk
