name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main, calma-launcher]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceptar licencias del SDK (viene preinstalado)
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calma-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Calma.apk
          gh release delete calma-apk --cleanup-tag --yes || true
          gh release create calma-apk Calma.apk --target "$GITHUB_SHA" --title "Calma (APK)" --notes "APK de prueba del launcher Calma."
